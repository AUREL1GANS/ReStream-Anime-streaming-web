<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Ambient background glow behind logo -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Film / Play Shape -->
  <g transform="translate(106, 106)">
    <!-- Stylized Hex / Shield Container -->
    <rect x="20" y="20" width="260" height="260" rx="60" fill="none" stroke="url(#primaryGrad)" stroke-width="18" filter="url(#glow)" />
    
    <!-- Neon Play Triangle -->
    <path d="M125 95 L215 150 L125 205 Z" fill="url(#primaryGrad)" />
    
    <!-- Cyber Dots / Accents -->
    <circle cx="65" cy="65" r="8" fill="#22d3ee" />
    <circle cx="235" cy="65" r="8" fill="#a855f7" />
    <circle cx="65" cy="235" r="8" fill="#6366f1" />
    <circle cx="235" cy="235" r="8" fill="#22d3ee" />
  </g>
</svg>
